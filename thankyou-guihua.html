    .bank-info {

      border: 1.5px solid #d4b08a;

      font-weight: bold;

    .notice-box {

      border: 1.5px solid #f0a500;
      border-radius: 10px;
      padding: 16px 18px;
      margin: 16px 0;
      font-size: 14px;
      color: #5a3e00;
      line-height: 1.85;
    }
    .closing { font-size: 14px; color: #666; line-height: 1.85; margin-top: 14px; }
    .back-btn {
